name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: --bundles nsis
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            args: --bundles app,dmg
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run complete automated test suite
        run: npm run test:all

      - name: Test updater manifest validation
        run: python .github/scripts/test_create_update_manifest.py

      - name: Verify updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Build release asset
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            $files = Get-ChildItem src-tauri/target/release/bundle/nsis -File | Where-Object { $_.Name.EndsWith('.exe') -or $_.Name.EndsWith('.exe.sig') }
          } else {
            $files = Get-ChildItem src-tauri/target/release/bundle -File -Recurse | Where-Object { $_.Name.EndsWith('.dmg') -or $_.Name.EndsWith('.app.tar.gz') -or $_.Name.EndsWith('.app.tar.gz.sig') }
          }
          if ($files.Count -lt 2) { throw 'Expected signed updater files and the standard installer.' }
          $files | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination release-assets }

      - name: Store release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out manifest tooling
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create and validate updater manifest
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TAG: ${{ github.ref_name }}
        run: python .github/scripts/create_update_manifest.py release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: XDocuments ${{ github.ref_name }}
          body: |
            XDocuments desktop release.

            Downloads:
            - Windows x64: NSIS setup executable
            - macOS Apple Silicon (arm64): DMG disk image
            - latest.json and signed updater bundles: automatic in-app updates
            - SHA256SUMS.txt: SHA-256 checksums

          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
